<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TelaShare V4.1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Segoe UI,Arial;min-height:100vh}main{max-width:1240px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;background:#2563eb;border-radius:14px;display:grid;place-items:center;font-size:22px}h1{margin:0;font-size:25px}.sub,label,.note{color:#8796aa}.sub{font-size:12px}.state{border:1px solid #26354b;padding:8px 12px;border-radius:999px;color:#7ee5ad}.layout{display:grid;grid-template-columns:320px 1fr;gap:15px}.panel{background:#0c131d;border:1px solid #202d40;border-radius:18px;padding:16px}.field{margin-bottom:13px}label{font-size:11px;display:block;margin-bottom:6px}input,select,button{width:100%;min-height:42px;border-radius:10px;border:1px solid #29374b;background:#090f17;color:#fff;padding:9px 11px}button{font-weight:700;cursor:pointer}.primary{background:#2563eb}.danger{background:#a62029}.soft{background:#141d2a}.actions{display:grid;gap:8px}.check{display:flex;align-items:center;gap:8px;font-size:13px}.check input{width:17px;min-height:auto}.screen{aspect-ratio:16/9;background:#020409;border-radius:14px;overflow:hidden;position:relative}.screen video{width:100%;height:100%;object-fit:contain}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#8492a6}.bar{display:flex;justify-content:space-between;padding:12px 3px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid #202d40;border-radius:10px;padding:10px}.stat small{color:#718096}.stat strong{display:block;margin-top:4px}.invite{display:none;margin-top:12px}.copy{display:grid;grid-template-columns:1fr 85px;gap:6px}.turn{margin-top:12px;padding:9px;border-radius:10px;background:#09111c;border:1px solid #20324a;font-size:12px;color:#9cadc3}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head>
<body><main><div class="top"><div class="brand"><div class="logo">▣</div><div><h1>TelaShare V4.1</h1><div class="sub">WebRTC • STUN + TURN fallback</div></div></div><div class="state" id="state">● Pronto</div></div>
<div class="layout"><aside class="panel"><div class="field"><label>MODO</label><select id="role"><option value="host">Transmitir minha tela</option><option value="viewer">Assistir transmissão</option></select></div>
<div class="field"><label>CÓDIGO DA SALA</label><input id="room"></div><div class="field"><label>SENHA OPCIONAL</label><input id="password" type="password"></div>
<div class="field hostOnly"><label>QUALIDADE</label><select id="quality"><option value="720">720p • 30 FPS</option><option value="1080">1080p • 30 FPS</option><option value="60" selected>1080p • 60 FPS</option></select></div>
<div class="field hostOnly"><label class="check"><input id="audio" type="checkbox" checked> Áudio do sistema</label></div>
<div class="actions"><button class="soft hostOnly" id="gen">↻ Gerar código</button><button class="primary" id="start">▶ Iniciar</button><button class="danger" id="stop" disabled>■ Encerrar</button></div>
<div class="invite" id="invite"><label>LINK DO ESPECTADOR</label><div class="copy"><input id="url" readonly><button id="copy" class="soft">Copiar</button></div></div><div class="turn" id="turn">TURN: verificando…</div></aside>
<section class="panel"><div class="screen" id="screen"><video id="video" autoplay playsinline controls></video><div class="empty" id="empty">Aguardando transmissão</div></div><div class="bar"><span id="status">Sistema pronto</span><button class="soft" id="full" style="width:auto">⛶ Tela cheia</button></div>
<div class="stats"><div class="stat"><small>ESPECTADORES</small><strong id="count">0</strong></div><div class="stat"><small>FPS</small><strong id="fps">—</strong></div><div class="stat"><small>BITRATE</small><strong id="bitrate">—</strong></div><div class="stat"><small>CONEXÃO</small><strong id="conn">—</strong></div></div></section></div></main>
<script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),socket=io({reconnection:true});let room='',role='',stream=null,peers=new Map(),ice=[{urls:'stun:stun.l.google.com:19302'}],joined=false,timer=null,prev=new Map();
async function loadIce(){try{let r=await fetch('/api/ice'),j=await r.json();ice=j.iceServers;$('turn').textContent=j.turnEnabled?'TURN: ✓ configurado e disponível':'TURN: não configurado — usando somente STUN';$('turn').style.color=j.turnEnabled?'#7ee5ad':'#e5ba7e'}catch(e){$('turn').textContent='TURN: erro ao carregar configuração'}}
loadIce();const q=new URLSearchParams(location.search);if(q.get('room')){$('room').value=q.get('room');$('role').value='viewer'}if(!$('room').value)$('room').value='TS-'+Math.random().toString(36).slice(2,8).toUpperCase();
function mode(){document.querySelectorAll('.hostOnly').forEach(x=>x.style.display=$('role').value==='viewer'?'none':'block')}$('role').onchange=mode;mode();$('gen').onclick=()=>$('room').value='TS-'+Math.random().toString(36).slice(2,8).toUpperCase();
function pc(id){if(peers.has(id))return peers.get(id);let p=new RTCPeerConnection({iceServers:ice});p.onicecandidate=e=>e.candidate&&socket.emit('signal',{room,target:id,data:{candidate:e.candidate}});p.ontrack=e=>{$('video').srcObject=e.streams[0];$('empty').style.display='none';$('status').textContent='Recebendo transmissão'};p.onconnectionstatechange=()=>{$('conn').textContent=p.connectionState;if(p.connectionState==='connected')$('state').textContent='● Conectado';if(p.connectionState==='failed')$('status').textContent='Conexão falhou mesmo com ICE/TURN — confira a configuração'};if(role==='host'&&stream)stream.getTracks().forEach(t=>p.addTrack(t,stream));peers.set(id,p);return p}
async function offer(id){let p=pc(id),o=await p.createOffer();await p.setLocalDescription(o);socket.emit('signal',{room,target:id,data:{description:p.localDescription}})}
$('start').onclick=async()=>{await loadIce();room=$('room').value.trim().toUpperCase();role=$('role').value;if(role==='host'){let q=$('quality').value,v=q==='720'?{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}:{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:q==='60'?60:30}};try{stream=await navigator.mediaDevices.getDisplayMedia({video:v,audio:$('audio').checked});$('video').srcObject=stream;$('empty').style.display='none';stream.getVideoTracks()[0].onended=stop}catch(e){$('status').textContent='Captura cancelada';return}$('url').value=location.origin+'/?room='+encodeURIComponent(room);$('invite').style.display='block';$('state').textContent='● Transmitindo';$('status').textContent='Transmitindo sua tela'}else{$('state').textContent='● Conectando';$('status').textContent='Conectando…'}joined=true;socket.emit('join-room',{room,role,password:$('password').value});$('start').disabled=true;$('stop').disabled=false;stats()};
socket.on('peer-ready',async x=>{if(role==='host'&&x.role==='viewer')offer(x.id)});socket.on('signal',async({from,data})=>{let p=pc(from);try{if(data.description){await p.setRemoteDescription(data.description);if(data.description.type==='offer'){let a=await p.createAnswer();await p.setLocalDescription(a);socket.emit('signal',{room,target:from,data:{description:p.localDescription}})}}else if(data.candidate)await p.addIceCandidate(data.candidate)}catch(e){}});
socket.on('room-count',n=>$('count').textContent=n);socket.on('join-error',m=>{alert(m);stop()});socket.on('host-left',()=>{$('status').textContent='Transmissor encerrou a sala'});socket.on('connect',()=>{if(joined)socket.emit('join-room',{room,role,password:$('password').value})});
function stats(){clearInterval(timer);timer=setInterval(async()=>{let fs=[],bs=[];for(let [id,p] of peers){let rs=await p.getStats();rs.forEach(r=>{if((r.type==='inbound-rtp'||r.type==='outbound-rtp')&&r.kind==='video'){let bytes=r.bytesReceived??r.bytesSent,frames=r.framesDecoded??r.framesEncoded??0,k=id+r.type,o=prev.get(k)||{b:bytes,f:frames,t:r.timestamp},dt=(r.timestamp-o.t)/1000;if(dt>0){bs.push((bytes-o.b)*8/dt/1000);fs.push((frames-o.f)/dt)}prev.set(k,{b:bytes,f:frames,t:r.timestamp})}})}$('fps').textContent=fs.length?Math.max(...fs).toFixed(0):'—';$('bitrate').textContent=bs.length?Math.max(...bs).toFixed(0)+' kbps':'—'},2000)}
function stop(){joined=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;peers.forEach(p=>p.close());peers.clear();clearInterval(timer);$('video').srcObject=null;$('empty').style.display='grid';$('start').disabled=false;$('stop').disabled=true;$('state').textContent='● Pronto';$('status').textContent='Sistema pronto'}$('stop').onclick=stop;$('copy').onclick=()=>navigator.clipboard.writeText($('url').value);$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('screen').requestFullscreen();
</script></body></html>
